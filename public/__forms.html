<!doctype html>
<!--
  Netlify Forms registration file.

  With @netlify/plugin-nextjs v5, Netlify's build-time form detection no
  longer scans Next.js's prerendered output (see
  https://ntl.fyi/next-runtime-forms-migration) — it only scans genuinely
  static files under /public. This file exists purely so Netlify's deploy
  bot can find and register the "contact" form; it's never actually shown
  to visitors. The real, visible form lives in app/contact/contact-form.tsx
  and submits (via fetch) to this file's URL, matching the field names
  below exactly.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="ref" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="type" type="text" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
